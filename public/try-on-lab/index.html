<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>TattooVis · 定点试戴工作室</title>
    <script>
      // Legacy entry: hand off to the app-shell studio page, preserving the
      // language and mapping old ?panel= deep links to the standalone pages.
      (function () {
        var params = new URLSearchParams(location.search);
        var lang = params.get('lang') === 'en' ? 'en' : params.get('lang') === 'zh' ? 'zh' : null;
        var base = lang === 'zh' ? '/zh' : '';
        var panel = params.get('panel');
        var target =
          panel === 'designs' || panel === 'history'
            ? base + '/' + panel
            : base + '/studio' + (lang ? '?lang=' + lang : '');
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui; padding: 2rem">
      Redirecting to the TattooVis studio…
    </p>
  </body>
</html>
